# 2 ая версия CI/CD
# теперь бот крутится как служба Windows

stages:
  - stop_bot
  - install_packages
  - update_code
  - start_bot
  - notify
  - notify_fail

stop_bot:
  stage: stop_bot
  tags:
    - rpup_pak_updater
  script:
    - nssm stop AnalyticsBot
  only:
    - master
  dependencies: []

deploy_packages:
  stage: install_packages
  tags:
    - rpup_pak_updater
  script:
    - Rscript -e "install.packages(c('ps', 'purrr', 'telegram.bot', 'dplyr', 'httr2'), repos='https://cran.r-project.org')"
  only:
    - master
  dependencies:
    - stop_bot

update_code:
  stage: update_code
  tags:
    - rpup_pak_updater
  script:
    - cd C:\scripts\alsey\netpeak_core\nc_analytics_team\telegram_bot
    - git -c safe.directory="*" fetch origin master
    - git -c safe.directory="*" reset --hard origin/master
  only:
    - master
  dependencies:
    - deploy_packages

start_bot:
  stage: start_bot
  tags:
    - rpup_pak_updater
  script:
    - nssm start AnalyticsBot
  only: 
    - master
  dependencies:
    - update_code

notify:
  stage: notify
  when: on_success
  tags:
    - rpup_pak_updater
  script:
    - Rscript ci_command/success.R
  only:
    - master
  dependencies:
    - start_bot

notify_fail:
  stage: notify_fail
  script:
    - Rscript ci_command/fail.R
  when: on_failure
  only:
    - master
  tags:
    - rpup_pak_updater
  dependencies: []
